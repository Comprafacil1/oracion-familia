<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Una Misma Raíz — Película de Oración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #F8F1E2;
    --ink-soft: #EFE6D2;
    --gold: #C9A24B;
    --bg: #08070a5;
    --scrim-bottom: linear-gradient(to top, rgba(8,6,3,.88) 0%, rgba(8,6,3,.62) 30%, rgba(8,6,3,.18) 58%, rgba(8,6,3,0) 82%);
    --scrim-full: radial-gradient(ellipse at center, rgba(6,5,3,.45) 0%, rgba(6,5,3,.62) 100%);
    --display: 'Playfair Display', Georgia, serif;
    --body-font: 'Lora', Georgia, serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#050403;
    overflow:hidden;
    font-family:var(--body-font);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative; width:100vw; height:100svh; height:100vh;
    overflow:hidden; background:#050403;
  }
  .scene{
    position:absolute; inset:0;
    opacity:0; visibility:hidden;
    transition: opacity 1.4s ease;
    pointer-events:none;
  }
  .scene.active{
    opacity:1; visibility:visible;
    pointer-events:auto;
    z-index:2;
  }
  .scene.prev{ z-index:1; }
  .frame{
    position:absolute; inset:0; overflow:hidden;
  }
  .frame img{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    max-width:none;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(1.02);
    object-fit:cover;
    filter:saturate(0.96) contrast(1.02);
  }
  .scrim{ position:absolute; inset:0; }
  .scrim.bottom{ background:var(--scrim-bottom); }
  .scrim.full{ background:var(--scrim-full); }
  .scrim.extra::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(6,5,3,.55), rgba(6,5,3,.2) 45%, rgba(6,5,3,.55));
  }

  .content{
    position:absolute; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; color:var(--ink);
    padding: 0 6vw;
    z-index:3;
  }
  .content.anchor-bottom{
    bottom: 9vh;
    align-items:center;
  }
  .content.anchor-center{
    top:50%; transform:translateY(-50%);
    max-height:82vh; overflow-y:auto;
    scrollbar-width:thin;
  }
  .content.anchor-center::-webkit-scrollbar{width:4px;}
  .content.anchor-center::-webkit-scrollbar-thumb{background:rgba(248,241,226,.25); border-radius:4px;}

  .eyebrow{
    font-family:var(--body-font);
    font-size: clamp(0.72rem, 1.3vw, 0.92rem);
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 1.1em 0;
    font-weight:500;
  }
  .title-lead{
    font-family:var(--display);
    font-weight:600;
    font-size: clamp(1.6rem, 5vw, 3.1rem);
    letter-spacing:0.02em;
    margin:0 0 0.5em 0;
    color:var(--ink);
    text-shadow: 0 2px 24px rgba(0,0,0,.5);
  }
  .body-text{
    font-family:var(--body-font);
    font-weight:400;
    font-size: clamp(1.08rem, 2.5vw, 1.6rem);
    line-height:1.55;
    max-width:44rem;
    color:var(--ink-soft);
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
    margin:0;
  }
  .body-text p{ margin:0 0 0.9em 0; }
  .body-text p:last-child{ margin-bottom:0; }
  .kind-verse .body-text{
    font-family:var(--display);
    font-style:italic;
    font-weight:500;
    font-size: clamp(1.2rem, 3vw, 1.85rem);
    max-width:42rem;
  }
  .kind-prayer .body-text{
    font-size: clamp(1.02rem, 2.05vw, 1.28rem);
    max-width:38rem;
    text-align:center;
  }
  .kind-closing .body-text{
    font-family:var(--display);
    font-weight:600;
    font-size: clamp(1.5rem, 4.4vw, 2.6rem);
    letter-spacing:0.04em;
    max-width:none;
  }

  /* Ken Burns variants */
  .kb-zoom-in{ animation-name:kbZoomIn; }
  .kb-zoom-out{ animation-name:kbZoomOut; }
  .kb-zoom-slow{ animation-name:kbZoomSlow; }
  .kb-zoom-out-slow{ animation-name:kbZoomOutSlow; }
  .kb-zoom-in-dramatic{ animation-name:kbZoomInDramatic; }
  .kb-pan-l{ animation-name:kbPanL; }
  .kb-pan-r{ animation-name:kbPanR; }
  .kb-pan-u{ animation-name:kbPanU; }
  .kb-pan-fwd{ animation-name:kbPanFwd; }
  .frame img.kb{
    animation-timing-function: ease-in-out;
    animation-fill-mode: forwards;
    animation-iteration-count:1;
  }
  @keyframes kbZoomIn{ from{transform:translate(-50%,-50%) scale(1.02);} to{transform:translate(-50%,-50%) scale(1.18);} }
  @keyframes kbZoomOut{ from{transform:translate(-50%,-50%) scale(1.2);} to{transform:translate(-50%,-50%) scale(1.02);} }
  @keyframes kbZoomSlow{ from{transform:translate(-50%,-50%) scale(1.03);} to{transform:translate(-50%,-50%) scale(1.11);} }
  @keyframes kbZoomOutSlow{ from{transform:translate(-50%,-50%) scale(1.13);} to{transform:translate(-50%,-50%) scale(1.02);} }
  @keyframes kbZoomInDramatic{ from{transform:translate(-50%,-50%) scale(1.04);} to{transform:translate(-50%,-50%) scale(1.28);} }
  @keyframes kbPanL{ from{transform:translate(-46%,-50%) scale(1.14);} to{transform:translate(-54%,-50%) scale(1.14);} }
  @keyframes kbPanR{ from{transform:translate(-54%,-50%) scale(1.14);} to{transform:translate(-46%,-50%) scale(1.14);} }
  @keyframes kbPanU{ from{transform:translate(-50%,-46%) scale(1.16);} to{transform:translate(-50%,-54%) scale(1.16);} }
  @keyframes kbPanFwd{ from{transform:translate(-50%,-50%) scale(1.05);} to{transform:translate(-50%,-52%) scale(1.22);} }

  /* Fade to black for final scene */
  .end-veil{
    position:absolute; inset:0; background:#050403; opacity:0;
    z-index:5; pointer-events:none;
  }
  .end-veil.veil-in{ animation:veilFade linear forwards; }
  @keyframes veilFade{ from{opacity:0;} to{opacity:1;} }

  /* Progress bar */
  #progress{
    position:absolute; top:0; left:0; height:2.5px;
    background:var(--gold); z-index:20;
    transition:width .5s ease;
    opacity:.85;
  }

  /* Controls */
  #controls{
    position:absolute; left:50%; bottom:2.4vh; transform:translateX(-50%);
    display:flex; align-items:center; gap:0.9rem;
    z-index:30;
    padding:0.5rem 0.9rem;
    background:rgba(10,8,5,.32);
    border:1px solid rgba(248,241,226,.16);
    border-radius:999px;
    backdrop-filter: blur(6px);
    transition: opacity .5s ease;
  }
  #controls.hidden{ opacity:0; pointer-events:none; }
  .ctrl-btn{
    width:2.5rem; height:2.5rem;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; cursor:pointer;
    color:var(--ink); opacity:0.88;
    border-radius:50%;
    transition: opacity .2s ease, background .2s ease;
  }
  .ctrl-btn:hover{ opacity:1; background:rgba(248,241,226,.1); }
  .ctrl-btn svg{ width:1.15rem; height:1.15rem; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .ctrl-btn.play svg{ fill:currentColor; stroke:none; }

  #tapzone-l, #tapzone-r{
    position:absolute; top:0; bottom:0; width:32%;
    z-index:10; background:transparent; border:none; padding:0; cursor:pointer;
  }
  #tapzone-l{ left:0; }
  #tapzone-r{ right:0; }

  @media (max-width:640px){
    .content.anchor-bottom{ bottom:11vh; }
    #controls{ gap:0.5rem; padding:0.4rem 0.6rem; }
    .ctrl-btn{ width:2.2rem; height:2.2rem; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="progress"></div>
  <div id="scenes"></div>
  <button id="tapzone-l" aria-label="Anterior"></button>
  <button id="tapzone-r" aria-label="Siguiente"></button>

  <div id="controls">
    <button class="ctrl-btn" id="btn-prev" aria-label="Escena anterior">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button class="ctrl-btn play" id="btn-play" aria-label="Reproducir o pausar">
      <svg id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      <svg id="icon-play" viewBox="0 0 24 24" style="display:none;"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>
    </button>
    <button class="ctrl-btn" id="btn-next" aria-label="Siguiente escena">
      <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>
    <button class="ctrl-btn" id="btn-full" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
    </button>
  </div>
</div>

<script>
(function(){

  function img(id){
    return "https://images.unsplash.com/photo-" + id + "?auto=format&fit=crop&w=2400&q=80";
  }

  var IMAGES = {
    roots:  img("1546441471-c55d743f9fa3"),
    path:   img("1752230446597-a5b08f8647e4"),
    sky:    img("1762030085994-79285eee5bc9"),
    river:  img("1655175070838-829db889485f"),
    lake1:  img("1754206351637-42eb767d11c3"),
    leaves: img("1779398784474-8f06058692a1"),
    rays:   img("1612821394773-23f0a7d33ede"),
    mount:  img("1767601048325-1403b4eeee91"),
    lake2:  img("1770217404839-36ccbb8099c6"),
    drop:   img("1580133318324-f2f76d987dd8")
  };

  var ORACION_INICIAL =
"Dios Todopoderoso,\ngracias por este momento.\n\n"+
"Gracias por permitirnos encontrarnos como familia,\naunque estemos en distintos lugares.\n\n"+
"Hoy hacemos una pausa\npara acercarnos a Ti.\n\n"+
"Tú conoces a nuestros queridos tíos.\nConoces sus vidas,\nsus corazones,\nsus necesidades\ny todo aquello que nosotros no podemos ver.\n\n"+
"Nosotros no conocemos todo,\npero Tú sí.\n\n"+
"Por eso, antes de pedir,\nqueremos simplemente estar contigo.\n\n"+
"Quédate con nosotros durante este momento.\nQuédate con nuestros tíos.\nQuédate con quienes hoy los acompañan.\n\n"+
"Y permite que cada persona que está aquí\npueda abrir su corazón,\nguardar silencio\ny escuchar tu Palabra.\n\n"+
"Hoy estamos aquí,\njuntos en oración.\n\n"+
"En el nombre de Jesús de Nazaret.\nAmén.";

  var ORACION_FINAL =
"Padre bueno,\ngracias por este tiempo compartido.\n\n"+
"Gracias por esta familia que nació de una misma raíz,\ny que hoy, a pesar de la distancia y del tiempo,\nsigue unida en tu nombre.\n\n"+
"Te encomendamos a cada uno de los nuestros:\na quienes hoy nos acompañan,\ny a quienes llevamos en la memoria y en el corazón.\n\n"+
"Guíanos, cuídanos, sostennos.\n\n"+
"Que tu paz more en cada hogar de esta familia,\ny que tu amor siga siendo la raíz que nos mantiene unidos.\n\n"+
"Gracias por escucharnos hoy.\n\n"+
"En el nombre de Jesús de Nazaret.\nAmén.";

  var SCENES = [
    { img:IMAGES.roots,  pos:"50% 65%", anim:"kb-zoom-in",        dur:15000, kind:"lead",
      ref:"UNA MISMA RAÍZ",
      body:"Hace muchos años, una familia comenzó a crecer desde una misma raíz:\nuna familia de 14 hijos." },

    { img:IMAGES.path,   pos:"50% 55%", anim:"kb-pan-r",          dur:15000, kind:"text",
      body:"Con el paso de los años, cada vida siguió su propio camino.\n\nAlgunos ya no están con nosotros,\npero el vínculo, la memoria y el amor permanecen." },

    { img:IMAGES.sky,    pos:"50% 45%", anim:"kb-zoom-out",       dur:14000, kind:"text",
      body:"Hoy, quienes continúan esta historia vuelven a encontrarse,\naunque estén lejos,\nunidos por una misma familia y una misma oración." },

    { img:IMAGES.river,  pos:"50% 50%", anim:"kb-pan-l",          dur:12000, kind:"text",
      body:"Antes de continuar, hacemos una pausa.\n\nRespiramos, y volvemos el corazón hacia Dios." },

    { img:IMAGES.lake1,  pos:"50% 55%", anim:"kb-zoom-slow",      dur:52000, kind:"prayer",
      ref:"ORACIÓN", body:ORACION_INICIAL },

    { img:IMAGES.leaves, pos:"50% 45%", anim:"kb-pan-r",          dur:12000, kind:"text",
      body:"Guardamos silencio.\n\nAbrimos el corazón.\n\nY escuchamos su Palabra." },

    { img:IMAGES.rays,   pos:"50% 40%", anim:"kb-zoom-in",        dur:15000, kind:"verse",
      ref:"SALMO 91:15",
      body:"Me invocará, y yo le responderé; con él estaré yo en la angustia; lo libraré y le glorificaré." },

    { img:IMAGES.mount,  pos:"50% 55%", anim:"kb-pan-l",          dur:13000, kind:"verse",
      ref:"MATEO 18:20",
      body:"Porque donde están dos o tres congregados en mi nombre, allí estoy yo en medio de ellos." },

    { img:IMAGES.lake2,  pos:"50% 50%", anim:"kb-zoom-out",       dur:19000, kind:"verse",
      ref:"FILIPENSES 4:6-7",
      body:"Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.\n\nY la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús." },

    { img:IMAGES.roots,  pos:"60% 40%", anim:"kb-pan-u",          dur:12000, kind:"verse",
      ref:"MATEO 21:22",
      body:"Y todo lo que pidiereis en oración, creyendo, lo recibiréis." },

    { img:IMAGES.river,  pos:"40% 45%", anim:"kb-pan-r",          dur:14000, kind:"verse",
      ref:"JUAN 15:7",
      body:"Si permanecéis en mí, y mis palabras permanecen en vosotros, pedid todo lo que queréis, y os será hecho." },

    { img:IMAGES.drop,   pos:"50% 50%", anim:"kb-zoom-in",        dur:13000, kind:"verse",
      ref:"JEREMÍAS 17:14",
      body:"Sáname, oh Jehová, y seré sano; sálvame, y seré salvo; porque tú eres mi alabanza." },

    { img:IMAGES.lake1,  pos:"40% 60%", anim:"kb-pan-l",          dur:13000, kind:"verse",
      ref:"SALMO 46:1",
      body:"Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones." },

    { img:IMAGES.mount,  pos:"50% 35%", anim:"kb-zoom-out-slow",  dur:16000, kind:"verse",
      ref:"SALMO 46:10",
      body:"Estad quietos, y conoced que yo soy Dios; seré exaltado entre las naciones; enaltecido seré en la tierra." },

    { img:IMAGES.leaves, pos:"60% 50%", anim:"kb-pan-r",          dur:13000, kind:"text",
      body:"Pensamos en nuestros tíos.\n\nEn sus vidas, sus historias,\ntodo lo que hoy no podemos ver, pero Dios sí conoce." },

    { img:IMAGES.sky,    pos:"50% 55%", anim:"kb-zoom-in",        dur:15000, kind:"verse",
      ref:"SALMO 121:1-2",
      body:"Alzaré mis ojos a los montes; ¿de dónde vendrá mi socorro?\n\nMi socorro viene de Jehová, que hizo los cielos y la tierra." },

    { img:IMAGES.path,   pos:"50% 60%", anim:"kb-pan-fwd",        dur:13000, kind:"text",
      body:"Alzamos los ojos, buscando ayuda más allá de nosotros mismos,\nconfiando en que el camino no se anda solo." },

    { img:IMAGES.mount,  pos:"40% 45%", anim:"kb-zoom-slow",      dur:15000, kind:"verse",
      ref:"SALMO 121:3-4",
      body:"No dará tu pie al resbaladero, ni se dormirá el que te guarda.\n\nHe aquí, no se adormecerá ni dormirá el que guarda a Israel." },

    { img:IMAGES.roots,  pos:"45% 55%", anim:"kb-pan-l",          dur:13000, kind:"text",
      body:"Sabemos que hay Alguien que vela, que no duerme,\nque cuida cada paso de esta familia." },

    { img:IMAGES.river,  pos:"55% 50%", anim:"kb-zoom-in",        dur:15000, kind:"verse",
      ref:"SALMO 121:7-8",
      body:"Jehová te guardará de todo mal; él guardará tu alma.\n\nJehová guardará tu salida y tu entrada desde ahora y para siempre." },

    { img:IMAGES.rays,   pos:"45% 50%", anim:"kb-zoom-in-dramatic", dur:16000, kind:"verse",
      ref:"SALMO 91:15",
      body:"Me invocará, y yo le responderé; con él estaré yo en la angustia; lo libraré y le glorificaré." },

    { img:IMAGES.leaves, pos:"45% 55%", anim:"kb-pan-r",          dur:13000, kind:"text",
      body:"Damos gracias por esta familia.\n\nPor quienes están,\npor quienes ya no están,\ny por el amor que nos sigue uniendo." },

    { img:IMAGES.lake2,  pos:"55% 50%", anim:"kb-zoom-out",       dur:12000, kind:"text",
      body:"La luz permanece.\nLa esperanza permanece.\nLa fe permanece." },

    { img:IMAGES.lake1,  pos:"50% 50%", anim:"kb-pan-l",          dur:11000, kind:"text",
      body:"Hoy estamos aquí,\njuntos en oración." },

    { img:IMAGES.lake2,  pos:"50% 45%", anim:"kb-zoom-slow",      dur:48000, kind:"prayer",
      ref:"ORACIÓN FINAL", body:ORACION_FINAL },

    { img:IMAGES.sky,    pos:"50% 55%", anim:"kb-zoom-out",       dur:16000, kind:"closing",
      body:"Paz. Esperanza. Familia. Fe." }
  ];

  var stage = document.getElementById("scenes");
  var progress = document.getElementById("progress");
  var controls = document.getElementById("controls");

  SCENES.forEach(function(s, i){
    var sec = document.createElement("div");
    sec.className = "scene";
    sec.dataset.index = i;

    var frame = document.createElement("div");
    frame.className = "frame";
    var im = document.createElement("img");
    im.src = s.img;
    im.style.objectPosition = s.pos;
    im.className = "kb " + s.anim;
    im.alt = "";
    frame.appendChild(im);
    sec.appendChild(frame);

    var scrim = document.createElement("div");
    scrim.className = "scrim " + (s.kind === "prayer" ? "full" : "bottom");
    sec.appendChild(scrim);

    var content = document.createElement("div");
    content.className = "content kind-" + s.kind + " " + (s.kind === "prayer" ? "anchor-center" : "anchor-bottom");

    if(s.ref){
      var eyebrow = document.createElement("p");
      eyebrow.className = "eyebrow";
      eyebrow.textContent = s.ref;
      content.appendChild(eyebrow);
    }

    var bodyWrap = document.createElement("div");
    bodyWrap.className = "body-text";
    var paras = s.body.split("\n\n");
    paras.forEach(function(p){
      var pEl = document.createElement("p");
      var lines = p.split("\n");
      lines.forEach(function(line, li){
        pEl.appendChild(document.createTextNode(line));
        if(li < lines.length - 1) pEl.appendChild(document.createElement("br"));
      });
      bodyWrap.appendChild(pEl);
    });
    content.appendChild(bodyWrap);

    if(s.kind === "lead"){
      bodyWrap.classList.remove("body-text");
      bodyWrap.classList.add("title-lead");
    }

    sec.appendChild(content);

    if(i === SCENES.length - 1){
      var veil = document.createElement("div");
      veil.className = "end-veil";
      veil.id = "end-veil";
      sec.appendChild(veil);
    }

    stage.appendChild(sec);
  });

  var sceneEls = Array.prototype.slice.call(document.querySelectorAll(".scene"));
  var idx = 0;
  var playing = true;
  var timer = null;
  var controlsTimeout = null;

  function restartImageAnim(sceneEl, dur){
    var im = sceneEl.querySelector("img.kb");
    im.style.animation = "none";
    im.style.animationDuration = "";
    void im.offsetWidth;
    im.style.animationDuration = dur + "ms";
    im.style.animation = "";
    var animName = getComputedStyle(im).animationName;
    im.style.animationName = animName;
    im.style.animationDuration = dur + "ms";
    im.style.animationTimingFunction = "ease-in-out";
    im.style.animationFillMode = "forwards";
  }

  function showScene(newIdx){
    idx = (newIdx + SCENES.length) % SCENES.length;
    sceneEls.forEach(function(el, i){
      if(i === idx){
        el.classList.add("active");
      } else {
        el.classList.remove("active");
      }
    });
    var s = SCENES[idx];
    restartImageAnim(sceneEls[idx], s.dur);
    updateProgress();

    if(idx === SCENES.length - 1){
      var veil = document.getElementById("end-veil");
      if(veil){
        veil.classList.remove("veil-in");
        void veil.offsetWidth;
        veil.style.animationDuration = Math.max(s.dur - 2500, 2000) + "ms";
        veil.style.animationDelay = "2000ms";
        veil.classList.add("veil-in");
      }
    }

    clearTimeout(timer);
    if(playing){
      timer = setTimeout(function(){ next(); }, s.dur);
    }
  }

  function updateProgress(){
    var pct = ((idx + 1) / SCENES.length) * 100;
    progress.style.width = pct + "%";
  }

  function next(){ showScene(idx + 1); }
  function prev(){ showScene(idx - 1); }

  function setPlaying(v){
    playing = v;
    document.getElementById("icon-pause").style.display = playing ? "block" : "none";
    document.getElementById("icon-play").style.display = playing ? "none" : "block";
    clearTimeout(timer);
    if(playing){
      var remaining = SCENES[idx].dur;
      timer = setTimeout(function(){ next(); }, remaining);
    }
  }

  document.getElementById("btn-next").addEventListener("click", function(){ next(); });
  document.getElementById("btn-prev").addEventListener("click", function(){ prev(); });
  document.getElementById("btn-play").addEventListener("click", function(){ setPlaying(!playing); });
  document.getElementById("tapzone-r").addEventListener("click", function(){ next(); });
  document.getElementById("tapzone-l").addEventListener("click", function(){ prev(); });

  document.getElementById("btn-full").addEventListener("click", function(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight"){ next(); }
    else if(e.key === "ArrowLeft"){ prev(); }
    else if(e.key === " "){ e.preventDefault(); setPlaying(!playing); }
    else if(e.key === "f" || e.key === "F"){ document.getElementById("btn-full").click(); }
  });

  var touchStartX = null;
  document.getElementById("stage").addEventListener("touchstart", function(e){
    touchStartX = e.changedTouches[0].clientX;
  }, {passive:true});
  document.getElementById("stage").addEventListener("touchend", function(e){
    if(touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){
      if(dx < 0) next(); else prev();
    }
    touchStartX = null;
  }, {passive:true});

  function nudgeControls(){
    controls.classList.remove("hidden");
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(function(){
      controls.classList.add("hidden");
    }, 4200);
  }
  ["mousemove","touchstart","click"].forEach(function(ev){
    document.addEventListener(ev, nudgeControls, {passive:true});
  });
  nudgeControls();

  showScene(0);
})();
</script>
</body>
</html>
